    offer_slug_aliases: []
    title: Grok for Startups credits
    summary: Venture-backed startups with a live product can apply for promotional credits usable in one balance across Grok, Grok Build, Grok Bot and the Grok API, sized to their funding, revenue and current AI spend.
    description: SpaceXSI sizes each grant to the applicant's stage and usage, aiming for about six months of realistic usage. 20% of the credits are issued on approval and the remaining 80% once onboarding is complete. Unless the approval says otherwise, credits expire six months after they are applied. One grant per company.
    lifecycle:
      status: active
      effective_from: 2026-10-23T08:52:44.000Z
    economics:
      consideration:
        kind: none
      benefits:
        - benefit_id: ben_credits
          kind: other
          description: Promotional usage credits in U.S. dollars, held in one balance for Grok, Grok Build, Grok Bot and the Grok API. The amount depends on funding, revenue and current AI spend and is stated in the approval email; 20% is released on approval and 80% after onboarding. Credits expire six months after they are applied unless the approval states otherwise.
        - benefit_id: ben_support
          kind: other
          description: Hands-on onboarding and a direct line to the SpaceXSI startups team.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_venture
            kind: manual
            reason: external-verification
            statement: The company has venture backing; companies that do not qualify yet can reapply once they have raised.
          - criterion_id: cri_live_product
            kind: manual
            reason: external-verification
            statement: The company has a live product.
          - criterion_id: cri_work_email
            kind: manual
            reason: external-verification
            statement: The applicant uses a work email on the same domain as the company website; applications from personal email addresses are not approved.
          - criterion_id: cri_one_grant
            kind: manual
            reason: not-machine-evaluable
            statement: Only one grant is available per company group. Companies that received credits from an earlier program may still apply.
