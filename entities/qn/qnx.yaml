profile:
  summary: QNX, a division of BlackBerry, provides real-time operating system, hypervisor and safety-certified software for embedded, software-defined and physical AI systems.
  description: QNX builds the QNX OS microkernel RTOS, QNX Hypervisor, QNX OS for Safety and QNX Sound for embedded and mission-critical systems.
