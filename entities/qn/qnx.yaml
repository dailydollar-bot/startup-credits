  - offer_id: off_01m5ke2yedeytkztjs2c46xxe2
    offer_slug: qnx-launchpad
    offer_slug_aliases: []
    title: QNX Launchpad commercial QNX 8.0 software for startups
    summary: Startups and small companies with annual revenue up to US$10 million that are developing a product for commercial sale can get commercial QNX 8.0 development software at startup-friendly costs for up to two years.
    description: QNX Launchpad is a defined package of commercial QNX 8.0 development software and licensing sized for qualifying early-stage companies. Participation is available for up to two years, after which participants move towards standard commercial QNX licensing. QNX does not publish the programme price.
    lifecycle:
      status: active
      effective_from: 2026-10-14T00:00:00.000Z
    economics:
      consideration:
        kind: unknown
        description: Commercial QNX software is provided at startup-friendly costs; QNX does not publish the price or discount.
      benefits:
        - benefit_id: ben_software
          kind: other
          description: Access for commercial use to QNX SDP 8.0 development seats, QNX OS and QNX OS for Safety, QNX Hypervisor and QNX Hypervisor for Safety, QNX Sound and other software from the QNX product portfolio, with participation available for up to two years.
        - benefit_id: ben_support
          kind: other
          description: Access to QNX technical support, embedded engineering expertise, and an ecosystem of hardware support, software, tools and services.
        - benefit_id: ben_accelerator
          kind: other
          description: Companies that are part of a recognised incubator or accelerator programme are eligible for additional benefits; the source does not list them.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_revenue
            kind: manual
            reason: external-verification
            statement: The company is a startup, small or medium-sized business, scaleup or innovator with annual revenue of up to US$10 million.
          - criterion_id: cri_commercial_product
            kind: manual
            reason: not-machine-evaluable
            statement: The company is ready to develop a product for commercial sale. Learning, evaluation and non-commercial prototyping belong under QNX Everywhere instead.
          - criterion_id: cri_not_established
            kind: manual
            reason: external-verification
            statement: Organisations that are established, are already QNX customers, or need software and licensing beyond the scope of QNX Launchpad are directed to standard QNX commercial licensing.
