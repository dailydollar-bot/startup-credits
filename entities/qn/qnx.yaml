    access:
      availability: public
      method: form
      url: https://qnx.software/en/contact/sales
      instructions: Use Apply Now on the QNX Launchpad page, which opens the QNX contact sales form, to apply. Companies can apply directly or after using QNX Everywhere; QNX Everywhere is not a prerequisite.
