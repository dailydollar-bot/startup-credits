    access:
      availability: public
      method: form
      url: https://www.gladia.io/start-up-studio
      instructions: Use Apply now on the Startup Studio page to submit one short application with company name, website, team size, product description, intended use of Gladia and estimated monthly usage. Gladia replies within 7 business days.
